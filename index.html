<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Mother's Day, Mumma! 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 40px 0;
            animation: fadeInUp 1s ease;
        }

        .header h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #e91e63;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .heart-float {
            font-size: 3rem;
            color: #ff4081;
            animation: float 3s ease-in-out infinite;
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin: 50px 0;
        }

        .photo-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transform: translateY(0);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            animation: slideInUp 0.8s ease forwards;
            opacity: 0;
        }

        .photo-card:nth-child(1) { animation-delay: 0.1s; }
        .photo-card:nth-child(2) { animation-delay: 0.2s; }
        .photo-card:nth-child(3) { animation-delay: 0.3s; }
        .photo-card:nth-child(4) { animation-delay: 0.4s; }
        .photo-card:nth-child(5) { animation-delay: 0.5s; }

        .photo-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        }

        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
            transition: transform 0.4s ease;
        }

        .photo-card:hover img {
            transform: scale(1.05);
        }

        .caption {
            font-family: 'Dancing Script', cursive;
            font-size: 1.4rem;
            color: #e91e63;
            text-align: center;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .quote {
            font-style: italic;
            color: #666;
            text-align: center;
            font-size: 1rem;
            background: rgba(255,182,193,0.3);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #ff69b4;
        }

        .love-message {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            padding: 40px;
            border-radius: 25px;
            margin: 50px 0;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            animation: pulse 2s infinite;
        }

        .love-message h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            color: #ff4081;
            font-size: 20px;
            animation: floatHeart 6s linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2.5rem; }
            .photo-gallery { grid-template-columns: 1fr; }
            .photo-card img { height: 200px; }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="container">
        <div class="header">
            <h1>Happy Mother's Day, Mumma! 💕</h1>
            <div class="heart-float">
                <i class="fas fa-heart"></i>
            </div>
        </div>

        <div class="photo-gallery" id="photoGallery">
            <!-- YOUR 5 PHOTOS WILL APPEAR HERE -->
        </div>

        <div class="love-message">
            <h2>Dear Aai,</h2>
            <p style="font-size: 1.3rem; line-height: 1.6;">
                You are my first love, superwoman and my best friend. 
                Every moment with you is a treasure. Thank you for loving me 
                unconditionally. I love you more than words can express! 💖
            </p>
        </div>
    </div>

    <script>
        // 🔥 YOUR 5 PHOTOS - REPLACE THESE URLS! 🔥
        // 🔥 YOUR LOCAL IMAGES 
const yourPhotos = [
      "./hmd7.jpg",  // Photo 1
      "./hmd8.jpg",  // Photo 2
     "./hmd1.png",  // Photo 3
      "./hmd4.jpg",  // Photo 4
      "./hmd5.jpg"   // Photo 5
];

// Beautiful captions 
const captions = [
    "My forever love 💕",
    "You make every day magical ✨",
    "Best mumma in the world 🌟",
    "My heart beats for you ❤️",
    "Together forever 🥰"
];

function createPhotoCard(index) {
    const imageUrl = yourPhotos[index];
    const caption = captions[index % captions.length];
    
    // 🆕 10 UNIQUE QUOTES - Perfect for 5 photos!
    const allQuotes = [
        "A mother's love is more beautiful than flowers.",
        "Life doesn't come with a manual, it comes with a mother.",
        "A mother's hug lasts long after she lets go.",
        "All that I am, or hope to be, I owe to my mother.",
        "There is no role in life more essential than that of a mother.", 
    ];
    
    // Each photo gets DIFFERENT quote (index 0,1,2,3,4)
    const quote = allQuotes[index];
    
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.innerHTML = `
        <img src="${imageUrl}" alt="Mommy & Me" 
             onerror="this.src='https://images.unsplash.com/photo-1511894358529-b7f59694149c?w=400&h=300&fit=crop'">
        <div class="caption">${caption}</div>
        <div class="quote">"${allQuotes[index]}"</div>
    `;
    return card;
}    // Mother's Day quotes

        function createFloatingHearts() {
            const heartsContainer = document.getElementById('floatingHearts');
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '💖';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heartsContainer.appendChild(heart);

                setTimeout(() => heart.remove(), 7000);
            }, 300);
        }

        // Initialize - Create exactly 5 photo cards
        document.addEventListener('DOMContentLoaded', function() {
            const gallery = document.getElementById('photoGallery');
            
            // Create exactly 5 beautiful photo cards
            for(let i = 0; i < 5; i++) {
                const card = createPhotoCard(i);
                gallery.appendChild(card);
            }

            createFloatingHearts();
        });
    </script>
</body>
</html>
